<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Share image source (1200 × 630)</title>
<!--
  The source of public/og.jpg and public/og-websites.jpg: the first screen in
  small. Open it through the sketch server (which serves the repo root) and
  capture it at 1200 × 630:
    /design-reference/v4/og.html            → public/og.jpg
    /design-reference/v4/og.html?websites   → public/og-websites.jpg
-->
<style>
  @font-face {
    font-family: "Schibsted Grotesk"; font-weight: 400 700;
    src: url("/public/fonts/schibsted-grotesk-latin.woff2") format("woff2");
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #e4d4ba; color: #121211;
    font: 500 24px/1.3 "Schibsted Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .top { position: absolute; left: 48px; right: 56px; top: 42px; display: flex; justify-content: space-between; letter-spacing: -0.01em; }
  .top b { font-weight: 600; }
  .top span { color: #675640; }
  /* He stands on the peek; the edge of his beard is 69.7% across the cut-out. */
  .me { position: absolute; bottom: 18px; left: 462px; translate: -69.7% 0; height: 548px; width: auto; display: block; }
  h1 { position: absolute; left: 512px; right: 56px; top: 50%; translate: 0 -46%; font-weight: 500; }
  .say, .rest { display: block; }
  .say { font-size: 74px; line-height: .98; letter-spacing: -0.045em; font-weight: 600; text-wrap: balance; }
  .rest { margin-top: 22px; font-size: 31px; line-height: 1.16; letter-spacing: -0.025em; max-width: 25ch; text-wrap: pretty; }
  .tail { color: #675640; }
  .websites .say { font-size: 66px; }
  .peek { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #14245e; }
</style>
</head>
<body>
  <div class="top"><b>Juber Ahmed</b><span id="where">juberahmed.dev</span></div>
  <img class="me" src="/public/juber-cut.webp" alt="">
  <h1 id="line"><span class="say">I’m Juber, a frontend developer in Birmingham.</span> <span class="rest">I’ve worked on Wolseley’s online store since 2022, <span class="tail">and I build websites and apps of my own.</span></span></h1>
  <div class="peek"></div>
  <script>
    if (location.search.includes('websites')) {
      document.body.classList.add('websites');
      document.getElementById('where').textContent = 'juberahmed.dev/websites';
      document.getElementById('line').innerHTML = '<span class="say">Websites for Birmingham businesses, built by hand,</span> <span class="rest">with booking and enquiry forms that land straight in your inbox or WhatsApp.</span>';
    }
  </script>
</body>
</html>
